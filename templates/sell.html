{% extends "base.html" %}{% block content %}<div class="card"><h3>New Sale</h3><form method="POST"><select name="product_id" required style="width:100%;padding:10px;margin:5px 0">{% for p in products %}<option value="{{p[0]}}">{{p[1]}} ({{p[3]}} left) - {{p[4]}}</option>{% endfor %}</select><input name="quantity" type="number" min="1" placeholder="Quantity" required style="width:100%;padding:10px;margin:5px 0"><button style="width:100%;padding:12px;background:#0f172a;color:white;border:none;border-radius:8px">Sell</button></form></div>{% endblock %}
